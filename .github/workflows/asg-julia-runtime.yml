name: Asg Julia Runtime Bootstrap

on:
  push:
    branches: [julia-runtime-bootstrap-20260819]

jobs:
  bundle-julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.5'
          arch: x64
      - name: Verify Julia
        run: |
          julia --version
          JULIA_EXE="$(readlink -f "$(command -v julia)")"
          JULIA_ROOT="$(dirname "$(dirname "$JULIA_EXE")")"
          echo "JULIA_ROOT=$JULIA_ROOT" >> "$GITHUB_ENV"
          echo "$JULIA_ROOT"
      - name: Bundle runtime
        run: |
          tar -C "$(dirname "$JULIA_ROOT")" -czf julia-1.10.5-linux-x86_64-runtime.tar.gz "$(basename "$JULIA_ROOT")"
          ls -lh julia-1.10.5-linux-x86_64-runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: julia-1.10.5-linux-x86_64-runtime
          path: julia-1.10.5-linux-x86_64-runtime.tar.gz
          compression-level: 0
          retention-days: 1
